<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Grace | Coming Soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <style>
        /* InTandem ToolWorks — Meri WebUI
           Colorado Dusk / Celestial Workshop */

        :root {
            --ittw-bg: #20263a;
            --ittw-bg2: #353653;
            --ittw-violet: #514b70;

            --ittw-card: rgba(49, 52, 78, .82);
            --ittw-panel: rgba(39, 42, 64, .88);

            --ittw-line: #666986;
            --ittw-line-soft: rgba(150, 154, 190, .28);

            --ittw-text: #e5e4ee;
            --ittw-muted: #b8b7c9;

            --ittw-blue: #9cccec;
            --ittw-purple: #b9a7df;
            --ittw-gold: #e7cea0;

            --ittw-shadow: 0 12px 32px rgba(10, 12, 24, .18);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background:
                radial-gradient(
                    circle at 18% 0%,
                    rgba(118, 100, 160, .30),
                    transparent 38%
                ),
                radial-gradient(
                    circle at 85% 10%,
                    rgba(87, 128, 166, .22),
                    transparent 42%
                ),
                linear-gradient(
                    160deg,
                    #353653 0%,
                    #292e46 48%,
                    #20263a 100%
                ) !important;

            color: var(--ittw-text) !important;
            font-family: 'Montserrat', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
        }

        /* Panel Styling */
        .container {
            position: relative;
            z-index: 1;
            padding: 4rem 3rem;
            background: var(--ittw-panel);
            border: 1px solid var(--ittw-line);
            box-shadow: var(--ittw-shadow);
            backdrop-filter: blur(12px);
            border-radius: 4px;
            max-width: 90%;
            transition: transform 0.3s ease;
        }

        .container:hover {
            border-color: var(--ittw-line-soft);
            transform: translateY(-2px);
        }

        .badge {
            font-size: 0.75rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--ittw-gold);
            margin-bottom: 1.5rem;
            display: block;
            font-weight: 700;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: clamp(2.5rem, 8vw, 5.5rem);
            color: #ffffff;
            margin-bottom: 1rem;
            letter-spacing: 0.15rem;
            text-shadow: 0 0 20px rgba(185, 167, 223, 0.2);
        }

        .divider {
            width: 60px;
            height: 2px;
            background-color: var(--ittw-gold);
            margin: 1.5rem auto;
            opacity: 0.8;
        }

        p {
            font-size: 1.1rem;
            font-weight: 300;
            color: var(--ittw-muted);
            max-width: 500px;
            margin: 0 auto;
            line-height: 1.8;
        }

        /* Decorative corner accents */
        .container::before {
            content: "";
            position: absolute;
            top: -1px; left: -1px;
            width: 20px; height: 20px;
            border-top: 2px solid var(--ittw-gold);
            border-left: 2px solid var(--ittw-gold);
        }

        .container::after {
            content: "";
            position: absolute;
            bottom: -1px; right: -1px;
            width: 20px; height: 20px;
            border-bottom: 2px solid var(--ittw-gold);
            border-right: 2px solid var(--ittw-gold);
        }

        @media (max-width: 600px) {
            .container {
                padding: 3rem 1.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <span class="badge">Coming Soon</span>
        <h1>Quantum Grace</h1>
        <div class="divider"></div>
        <p>A modern adventure story.</p>
    </div>

</body>
</html>
